<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSM Job Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .search-section {
            background: #f5f5f5;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .search-section h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1em;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
            min-width: 150px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            flex: 1;
            min-width: 150px;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .status-message {
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            display: none;
        }

        .status-message.show {
            display: block;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status-message.loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .results-section {
            display: none;
        }

        .results-section.show {
            display: block;
        }

        .results-header {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            margin-bottom: 30px;
        }

        .results-header h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .results-header .stat {
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
        }

        .jobs-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .job-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .job-card:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .job-card h4 {
            color: #333;
            margin-bottom: 8px;
            font-size: 1.2em;
        }

        .job-card .company {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 8px;
        }

        .job-card .location {
            color: #666;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .job-card .meta {
            font-size: 0.85em;
            color: #999;
            margin-bottom: 12px;
        }

        .job-card .salary {
            background: #e8f4f8;
            color: #0066cc;
            padding: 8px 12px;
            border-radius: 4px;
            font-weight: 600;
            margin-bottom: 12px;
            display: inline-block;
        }

        .job-card .url {
            display: block;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #e0e0e0;
        }

        .job-card a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .job-card a:hover {
            text-decoration: underline;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state p {
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💼 CSM Job Dashboard</h1>
            <p>Find Customer Success Manager roles powered by ZipRecruiter</p>
        </div>

        <div class="content">
            <!-- Search Section -->
            <div class="search-section">
                <h2>🔍 Search for Jobs</h2>
                
                <div class="form-group">
                    <label for="jobTitle">Job Title *</label>
                    <input type="text" id="jobTitle" placeholder="e.g., Customer Success Manager" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="location">Location</label>
                        <input type="text" id="location" placeholder="e.g., Remote, US" value="Remote, US">
                    </div>
                    <div class="form-group">
                        <label for="maxResults">Max Results</label>
                        <input type="number" id="maxResults" min="1" max="100" value="30">
                    </div>
                </div>

                <div class="form-group">
                    <label for="industry">Industry (Optional)</label>
                    <select id="industry">
                        <option value="">-- All Industries --</option>
                        <option value="SaaS">SaaS</option>
                        <option value="Cybersecurity">Cybersecurity</option>
                        <option value="DevSecOps">DevSecOps</option>
                        <option value="DevOps">DevOps</option>
                        <option value="Cloud">Cloud</option>
                        <option value="FinTech">FinTech</option>
                        <option value="Healthcare Tech">Healthcare Tech</option>
                        <option value="E-commerce">E-commerce</option>
                        <option value="Data Analytics">Data Analytics</option>
                        <option value="AI/ML">AI/ML</option>
                    </select>
                </div>

                <div class="button-group">
                    <button class="btn-primary" id="searchBtn" onclick="searchJobs()">
                        🚀 Search Jobs
                    </button>
                    <button class="btn-secondary" id="clearBtn" onclick="clearResults()">
                        🗑️ Clear
                    </button>
                </div>

                <!-- Status Message -->
                <div class="status-message" id="statusMessage"></div>
            </div>

            <!-- Results Section -->
            <div class="results-section" id="resultsSection">
                <div class="results-header" id="resultsHeader"></div>
                <div id="jobsContainer"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status-message show ${type}`;
        }

        function hideStatus() {
            document.getElementById('statusMessage').classList.remove('show');
        }

        async function searchJobs() {
            const jobTitle = document.getElementById('jobTitle').value.trim();
            const location = document.getElementById('location').value.trim();
            const maxResults = document.getElementById('maxResults').value;
            const industry = document.getElementById('industry').value;

            if (!jobTitle) {
                showStatus('❌ Please enter a job title', 'error');
                return;
            }

            const btn = document.getElementById('searchBtn');
            btn.disabled = true;

            showStatus('🔄 Searching for jobs...', 'loading');

            try {
                const response = await fetch(`${API_BASE}/api/scrape`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        searchQuery: jobTitle,
                        location: location,
                        maxResults: parseInt(maxResults),
                        industry: industry || undefined,
                    }),
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                if (data.status === 'success') {
                    displayResults(data);
                    showStatus(`✅ Found ${data.totalResults} jobs!`, 'success');
                } else {
                    showStatus(`❌ Error: ${data.error}`, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showStatus(`❌ Error: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
            }
        }

        function displayResults(data) {
            const resultsSection = document.getElementById('resultsSection');
            const resultsHeader = document.getElementById('resultsHeader');
            const jobsContainer = document.getElementById('jobsContainer');

            // Clear previous results
            resultsHeader.innerHTML = '';
            jobsContainer.innerHTML = '';

            // Get results from ZipRecruiter actor
            const zipResults = data.actors?.ziprecruiter || data.actors?.google || {};
            const jobs = zipResults.results || [];
            const count = zipResults.count || 0;

            // Display header with results count
            resultsHeader.innerHTML = `
                <h3>📊 Results from ${zipResults.name || 'ZipRecruiter'}</h3>
                <div class="stat">${count} jobs found</div>
            `;

            // Display jobs
            if (jobs.length === 0) {
                jobsContainer.innerHTML = '<div class="empty-state"><p>No jobs found. Try different search terms.</p></div>';
            } else {
                jobsContainer.innerHTML = `<div class="jobs-container">${jobs.map(createJobCard).join('')}</div>`;
            }

            resultsSection.classList.add('show');
        }

        function createJobCard(job) {
            const salary = job.salary ? `<div class="salary">${job.salary}</div>` : '';
            const url = job.URL && job.URL !== '#' ? `<div class="url"><a href="${job.URL}" target="_blank">View Job →</a></div>` : '';
            const date = job.date ? `<div class="meta">${job.date}</div>` : '';

            return `
                <div class="job-card">
                    <h4>${job.job_title || 'Job Title'}</h4>
                    <div class="company">${job.company_name || 'Company'}</div>
                    <div class="location">📍 ${job.location || 'Location'}</div>
                    ${date}
                    ${salary}
                    ${url}
                </div>
            `;
        }

        function clearResults() {
            document.getElementById('jobTitle').value = '';
            document.getElementById('location').value = 'Remote, US';
            document.getElementById('maxResults').value = '30';
            document.getElementById('industry').value = '';
            document.getElementById('resultsSection').classList.remove('show');
            hideStatus();
        }
    </script>
</body>
</html>
